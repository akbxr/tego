name: release

# Push a tag like v0.2.0 to build the binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: build
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="tego_${os}_${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=$version" -o "dist/$name/tego" ./cmd/tego
            cp README.md dist/$name/
            [ -f LICENSE ] && cp LICENSE dist/$name/
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --generate-notes --verify-tag
